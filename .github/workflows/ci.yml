name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  lint-test-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: python -m py_compile server.py runtime_core/*.py

      - name: Unit and golden tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Smoke API
        run: bash tests/smoke_api.sh
